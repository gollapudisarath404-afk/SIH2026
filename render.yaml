services:
  # Backend - FastAPI Python Web Service
  - type: web
    name: schemesaathi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: PROJECT_NAME
        value: SchemeSaathi AI
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: schemesaathi
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Frontend - Vite React Static Site
  - type: web
    name: schemesaathi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
